name = "outfit-oracle-proxy"
main = "index.js"
compatibility_date = "2024-09-23"

[placement]
mode = "smart"

# Rate limiting via KV — create the namespace once, then paste the id below:
#   npx wrangler kv:namespace create "RATE_LIMIT_KV"
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Secrets — set after deploying:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put FAL_KEY          ← required for image generation (/image endpoint)
