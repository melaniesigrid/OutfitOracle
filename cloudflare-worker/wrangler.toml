name = "outfit-oracle-proxy"
main = "index.js"
compatibility_date = "2024-09-23"

[placement]
mode = "smart"

# Rate limiting via KV — create the namespace once, then paste the id below:
#   npx wrangler kv:namespace create "RATE_LIMIT_KV"
#
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c91ed5b74f69483a8ba543b0d9121b64"

# Apple JWKS cache (24 hours) — create once, paste id below:
#   npx wrangler kv:namespace create "APPLE_JWKS_KV"
#
[[kv_namespaces]]
binding ="APPLE_JWKS_KV"
id = "0026f7dd8bd64903870ae5b141344d42"

# Secrets — set after deploying:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put FAL_KEY              ← image generation (/image endpoint)
#   npx wrangler secret put NEON_DATABASE_URL    ← postgres://user:pass@host/db?sslmode=require
#   npx wrangler secret put APPLE_BUNDLE_ID      ← com.melaniesigrid.outfitoracle
#   npx wrangler secret put GOOGLE_CLIENT_ID     ← web OAuth client ID (used to validate aud)
#   npx wrangler secret put FACEBOOK_APP_ID      ← from developers.facebook.com
#   npx wrangler secret put FACEBOOK_APP_SECRET  ← from developers.facebook.com
