<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OutfitOracle Fog WeatherGlanceCard</title>
  <style>
    :root {
      --ink: #121820;
      --mist: rgba(255, 255, 255, 0.48);
      --mist-strong: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.44);
      --glass-fill: rgba(255, 255, 255, 0.28);
      --slate: #667785;
      --blue-gray: #a9bdca;
      --pearl: #edf3f7;
      --shadow: rgba(15, 23, 42, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(203, 213, 225, 0.52), transparent 34%),
        radial-gradient(circle at bottom right, rgba(148, 163, 184, 0.3), transparent 38%),
        #f4f7f9;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .stage {
      width: min(92vw, 430px);
      padding: 20px;
    }

    .weather-card {
      position: relative;
      overflow: hidden;
      min-height: 560px;
      border-radius: 38px;
      padding: 24px;
      background:
        radial-gradient(circle at 72% 18%, rgba(255,255,255,0.44), transparent 16%),
        linear-gradient(180deg, rgba(112, 132, 146, 0.94) 0%, rgba(174, 190, 199, 0.9) 38%, rgba(230, 236, 239, 0.92) 74%, rgba(173, 187, 193, 0.78) 100%);
      box-shadow:
        0 34px 92px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.42);
      isolation: isolate;
    }

    .weather-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.38), transparent 20%),
        radial-gradient(circle at 86% 30%, rgba(255,255,255,0.28), transparent 22%),
        linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.22) 44%, transparent 68%);
      pointer-events: none;
      z-index: 0;
      animation: lowLight 12s ease-in-out infinite;
    }

    .weather-card::after {
      content: "";
      position: absolute;
      inset: auto -34% -18% -34%;
      height: 45%;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(71, 85, 105, 0.34) 0%, rgba(226, 232, 240, 0.45) 48%, transparent 76%);
      filter: blur(1px);
      z-index: 0;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 14;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 1px 18px rgba(15,23,42,0.18);
    }

    .menu-button,
    .save-button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.42);
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: white;
      display: grid;
      place-items: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.26);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .fog-scene,
    .mist-layer,
    .particle-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fog-scene {
      z-index: 1;
    }

    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 210px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
      opacity: 0.42;
      filter: blur(0.4px);
      animation: horizonFade 7s ease-in-out infinite;
    }

    .silhouette {
      position: absolute;
      bottom: 112px;
      width: 80px;
      height: 156px;
      border-radius: 48px 48px 8px 8px;
      background: linear-gradient(180deg, rgba(51,65,85,0.16), rgba(15,23,42,0.22));
      filter: blur(3px);
      opacity: 0.22;
      transform: scale(var(--scale, 1));
      animation: silhouetteFade 9s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .silhouette.one { left: 44px; --scale: 0.78; --delay: -2s; }
    .silhouette.two { right: 60px; bottom: 98px; --scale: 0.62; --delay: -5s; }
    .silhouette.three { left: 176px; bottom: 130px; --scale: 0.48; --delay: -7s; }

    .mist-band {
      position: absolute;
      left: -34%;
      top: var(--top, 160px);
      width: var(--width, 120%);
      height: var(--height, 96px);
      border-radius: 999px;
      background: radial-gradient(ellipse, var(--mist), transparent 70%);
      filter: blur(var(--blur, 18px));
      opacity: var(--opacity, 0.58);
      animation: mistDrift var(--duration, 20s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .mist-band.strong {
      background: radial-gradient(ellipse, var(--mist-strong), transparent 72%);
      z-index: 9;
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 8;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.32) 48%, rgba(255,255,255,0.12)),
        radial-gradient(circle at 50% 42%, rgba(255,255,255,0.38), transparent 42%);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      animation: veilBreathe 6.8s ease-in-out infinite;
    }

    .fog-line {
      position: absolute;
      left: -50%;
      top: var(--top, 260px);
      width: var(--width, 260px);
      height: var(--height, 3px);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.54), transparent);
      opacity: var(--opacity, 0.42);
      filter: blur(1px);
      animation: lineDrift var(--duration, 9s) linear infinite;
      animation-delay: var(--delay, 0s);
      z-index: 10;
    }

    .particle {
      position: absolute;
      left: var(--left, 50%);
      top: var(--top, 50%);
      width: var(--size, 5px);
      height: var(--size, 5px);
      border-radius: 999px;
      background: rgba(255,255,255,0.54);
      filter: blur(1px);
      opacity: var(--opacity, 0.4);
      animation: particleFloat var(--duration, 8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      z-index: 11;
    }

    .glass-panel {
      position: relative;
      z-index: 14;
      margin-top: 110px;
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.44), rgba(255,255,255,0.17));
      backdrop-filter: blur(36px) saturate(122%);
      -webkit-backdrop-filter: blur(36px) saturate(122%);
      box-shadow:
        0 24px 80px rgba(15, 23, 42, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.58),
        inset 0 -1px 0 rgba(255,255,255,0.16);
    }

    .glass-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(110deg, transparent 0 30%, rgba(255,255,255,0.22) 43%, transparent 58% 100%);
      opacity: 0;
      transform: translateX(-70%);
      animation: glassSweep 8.2s ease-in-out infinite;
      pointer-events: none;
    }

    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 1px 14px rgba(15,23,42,0.18);
      font-weight: 650;
      font-size: 14px;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .temp-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 16px;
      margin-top: 14px;
    }

    .temperature {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 92px;
      line-height: 0.9;
      letter-spacing: -0.08em;
      color: rgba(255,255,255,0.98);
      text-shadow: 0 16px 52px rgba(15,23,42,0.2);
    }

    .feels {
      padding-top: 12px;
      text-align: right;
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 650;
    }

    .feels strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      line-height: 1.05;
      font-weight: 400;
    }

    .condition-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: rgba(255,255,255,0.96);
    }

    .mini-fog-icon {
      width: 42px;
      height: 34px;
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
    }

    .mini-fog-icon span {
      position: absolute;
      left: 0;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 12px rgba(255,255,255,0.42);
      animation: miniFog 2.4s ease-in-out infinite;
    }

    .mini-fog-icon span:nth-child(1) { top: 8px; width: 34px; animation-delay: -0.2s; }
    .mini-fog-icon span:nth-child(2) { top: 17px; width: 42px; left: -2px; animation-delay: -0.8s; opacity: 0.72; }
    .mini-fog-icon span:nth-child(3) { top: 26px; width: 28px; left: 8px; animation-delay: -1.4s; opacity: 0.58; }

    .condition-text strong {
      display: block;
      font-size: 18px;
      line-height: 1.15;
    }

    .condition-text span {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }

    .divider {
      height: 1px;
      margin: 20px 0 14px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.46), transparent);
    }

    .verdict-label {
      color: rgba(18,24,32,0.46);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .verdict {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 1.08;
      color: rgba(18,24,32,0.82);
      text-wrap: balance;
    }

    .fog-mark {
      font-size: 25px;
      display: inline-block;
      animation: fogMark 3.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 14px rgba(15,23,42,0.08));
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .stat-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.34);
      color: rgba(18,24,32,0.6);
      flex: 0 0 auto;
    }

    .stat-title {
      font-size: 11px;
      color: rgba(18,24,32,0.48);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin-top: 1px;
      font-size: 13px;
      color: rgba(18,24,32,0.78);
      font-weight: 760;
    }

    .outfit-strip {
      position: relative;
      z-index: 14;
      margin-top: 18px;
    }

    .strip-title {
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      font-weight: 780;
      text-shadow: 0 1px 18px rgba(15,23,42,0.16);
    }

    .chips {
      display: flex;
      gap: 9px;
      margin-top: 10px;
      overflow: hidden;
    }

    .chip {
      flex: 1;
      min-height: 70px;
      border-radius: 20px;
      padding: 10px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(18,24,32,0.74);
      box-shadow: 0 12px 36px rgba(15,23,42,0.1), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .chip strong {
      display: block;
      font-size: 12px;
    }

    .chip span {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      color: rgba(18,24,32,0.5);
      font-weight: 700;
    }

    .bottom-note {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      z-index: 14;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 18px rgba(15,23,42,0.16);
    }

    .motion-pill {
      white-space: nowrap;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @keyframes lowLight {
      0%, 100% { opacity: 0.58; transform: translateX(-3%); }
      50% { opacity: 0.86; transform: translateX(5%); }
    }

    @keyframes horizonFade {
      0%, 100% { opacity: 0.24; transform: scaleX(0.86); }
      50% { opacity: 0.54; transform: scaleX(1.06); }
    }

    @keyframes silhouetteFade {
      0%, 100% { opacity: 0.12; transform: translateX(-4px) scale(var(--scale, 1)); }
      50% { opacity: 0.28; transform: translateX(6px) scale(var(--scale, 1)); }
    }

    @keyframes mistDrift {
      0%, 100% { transform: translateX(-6%) scaleX(1); }
      50% { transform: translateX(42%) scaleX(1.14); }
    }

    @keyframes veilBreathe {
      0%, 100% { opacity: 0.64; filter: blur(0); }
      50% { opacity: 0.88; filter: blur(0.5px); }
    }

    @keyframes lineDrift {
      from { transform: translateX(0); }
      to { transform: translateX(160vw); }
    }

    @keyframes particleFloat {
      0%, 100% { transform: translate3d(-10px, 8px, 0); opacity: 0.12; }
      50% { transform: translate3d(18px, -10px, 0); opacity: var(--opacity, 0.4); }
    }

    @keyframes glassSweep {
      0%, 34% { transform: translateX(-75%); opacity: 0; }
      50% { opacity: 0.4; }
      66%, 100% { transform: translateX(75%); opacity: 0; }
    }

    @keyframes miniFog {
      0%, 100% { transform: translateX(-3px); opacity: 0.48; }
      50% { transform: translateX(6px); opacity: 1; }
    }

    @keyframes fogMark {
      0%, 100% { transform: translateX(-2px); opacity: 0.68; }
      50% { transform: translateX(4px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 420px) {
      .stage { padding: 12px; }
      .weather-card { min-height: 540px; border-radius: 32px; padding: 20px; }
      .glass-panel { margin-top: 102px; padding: 18px; }
      .temperature { font-size: 78px; }
      .verdict { font-size: 22px; }
      .bottom-note { font-size: 11px; }
    }
  </style>
  <link rel="stylesheet" href="./glance_card_parity.css" />
  <script defer src="./glance_card_parity.js"></script>
</head>
<body>
  <main class="stage" aria-label="OutfitOracle fog weather card animation demo">
    <section class="weather-card">
      <header class="topbar">
        <button class="menu-button" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="brand">OutfitOracle</div>
        <button class="save-button" aria-label="Save forecast">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 4h12v17l-6-3.5L6 21V4Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <div class="fog-scene" aria-hidden="true">
        <span class="horizon"></span>
        <span class="silhouette one"></span>
        <span class="silhouette two"></span>
        <span class="silhouette three"></span>
        <span class="mist-band" style="--top: 92px; --width: 128%; --height: 88px; --opacity: 0.34; --duration: 24s; --delay: -8s; --blur: 20px"></span>
        <span class="mist-band strong" style="--top: 158px; --width: 142%; --height: 108px; --opacity: 0.62; --duration: 19s; --delay: -2s; --blur: 22px"></span>
        <span class="mist-band" style="--top: 268px; --width: 136%; --height: 116px; --opacity: 0.52; --duration: 22s; --delay: -12s; --blur: 24px"></span>
        <span class="mist-band strong" style="--top: 362px; --width: 150%; --height: 126px; --opacity: 0.6; --duration: 20s; --delay: -6s; --blur: 26px"></span>
        <span class="veil"></span>
      </div>

      <div class="mist-layer" id="mistLineLayer" aria-hidden="true"></div>
      <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>

      <article class="glass-panel">
        <div class="location-row">
          <span class="location">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 21s7-5.2 7-12a7 7 0 1 0-14 0c0 6.8 7 12 7 12Z" stroke="currentColor" stroke-width="1.9" />
              <circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.9" />
            </svg>
            Toronto, CA
          </span>
          <span id="timeLabel">9:41</span>
        </div>

        <div class="temp-row">
          <div class="temperature">47°</div>
          <div class="feels">Feels like<strong>44°</strong></div>
        </div>

        <div class="condition-row">
          <span class="mini-fog-icon" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <div class="condition-text">
            <strong>Fog</strong>
            <span>Low visibility. High mystery.</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="verdict-label">Verdict</div>
        <div class="verdict">
          <span>Dress like a rumor.</span>
          <span class="fog-mark" aria-hidden="true">≋</span>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-icon" aria-hidden="true">◌</div>
            <div>
              <div class="stat-title">Visibility</div>
              <div class="stat-value">Low</div>
            </div>
          </div>
          <div class="stat">
            <div class="stat-icon" aria-hidden="true">≋</div>
            <div>
              <div class="stat-title">Humidity</div>
              <div class="stat-value">92%</div>
            </div>
          </div>
        </div>
      </article>

      <section class="outfit-strip" aria-label="Outfit context">
        <div class="strip-title">Outfit logic</div>
        <div class="chips">
          <div class="chip"><strong>Reflective detail</strong><span>Be seen</span></div>
          <div class="chip"><strong>Soft layers</strong><span>Mist friendly</span></div>
          <div class="chip"><strong>Closed shoes</strong><span>Damp ground</span></div>
        </div>
      </section>

      <footer class="bottom-note">
        <span>The weather is applying a blur filter.</span>
        <span class="motion-pill">mist: drift · veil: breathe</span>
      </footer>
    </section>
  </main>

  <script>
    const timeLabel = document.getElementById("timeLabel");
    const mistLineLayer = document.getElementById("mistLineLayer");
    const particleLayer = document.getElementById("particleLayer");

    function updateTime() {
      const now = new Date();
      timeLabel.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function createFogLines(count = 18) {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const line = document.createElement("span");
        line.className = "fog-line";

        const top = 92 + Math.random() * 360;
        const width = 160 + Math.random() * 260;
        const height = 1.5 + Math.random() * 3;
        const duration = 8 + Math.random() * 12;
        const delay = Math.random() * -14;
        const opacity = 0.12 + Math.random() * 0.38;

        line.style.setProperty("--top", `${top}px`);
        line.style.setProperty("--width", `${width}px`);
        line.style.setProperty("--height", `${height}px`);
        line.style.setProperty("--duration", `${duration}s`);
        line.style.setProperty("--delay", `${delay}s`);
        line.style.setProperty("--opacity", opacity.toFixed(2));

        fragment.appendChild(line);
      }

      mistLineLayer.appendChild(fragment);
    }

    function createParticles(count = 28) {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const particle = document.createElement("span");
        particle.className = "particle";

        particle.style.setProperty("--left", `${4 + Math.random() * 92}%`);
        particle.style.setProperty("--top", `${8 + Math.random() * 84}%`);
        particle.style.setProperty("--size", `${3 + Math.random() * 7}px`);
        particle.style.setProperty("--opacity", `${(0.14 + Math.random() * 0.34).toFixed(2)}`);
        particle.style.setProperty("--duration", `${6 + Math.random() * 8}s`);
        particle.style.setProperty("--delay", `${Math.random() * -8}s`);

        fragment.appendChild(particle);
      }

      particleLayer.appendChild(fragment);
    }

    updateTime();
    setInterval(updateTime, 30_000);
    createFogLines();
    createParticles();
  </script>
</body>
</html>
