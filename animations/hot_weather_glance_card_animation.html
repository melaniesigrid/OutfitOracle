<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OutfitOracle Hot WeatherGlanceCard</title>
  <style>
    :root {
      --ink: #25120a;
      --cream: #fff7ed;
      --heat: rgba(255, 184, 77, 0.76);
      --sun: #ffd166;
      --sun-core: #fff6b8;
      --coral: #ff7a59;
      --orange: #fb923c;
      --gold: #facc15;
      --glass-border: rgba(255, 255, 255, 0.5);
      --shadow: rgba(127, 29, 29, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.24), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255, 122, 89, 0.24), transparent 38%),
        #fff7ed;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .stage {
      width: min(92vw, 430px);
      padding: 20px;
    }

    .weather-card {
      position: relative;
      overflow: hidden;
      min-height: 560px;
      border-radius: 38px;
      padding: 24px;
      background:
        radial-gradient(circle at 76% 18%, rgba(255, 247, 181, 0.96), transparent 16%),
        linear-gradient(180deg, rgba(255, 180, 83, 0.98) 0%, rgba(255, 122, 89, 0.94) 42%, rgba(253, 186, 116, 0.9) 74%, rgba(255, 237, 213, 0.84) 100%);
      box-shadow:
        0 34px 92px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.5);
      isolation: isolate;
    }

    .weather-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,0.36), transparent 18%),
        radial-gradient(circle at 82% 24%, rgba(255,255,255,0.22), transparent 20%),
        linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.16) 42%, transparent 66%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
      animation: heatLight 7s ease-in-out infinite;
    }

    .weather-card::after {
      content: "";
      position: absolute;
      inset: auto -34% -18% -34%;
      height: 44%;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(154, 52, 18, 0.36) 0%, rgba(253, 186, 116, 0.32) 46%, transparent 76%);
      filter: blur(1px);
      z-index: 0;
      pointer-events: none;
    }

    .topbar {
      position: relative;
      z-index: 12;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.94);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 1px 18px rgba(127,29,29,0.18);
    }

    .menu-button,
    .save-button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.44);
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      color: white;
      display: grid;
      place-items: center;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .heat-scene,
    .shimmer-layer,
    .spark-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heat-scene {
      z-index: 1;
    }

    .sun-system {
      position: absolute;
      top: 58px;
      right: 34px;
      width: 168px;
      height: 168px;
      z-index: 3;
      animation: sunFloat 5.4s ease-in-out infinite;
    }

    .sun-glow {
      position: absolute;
      inset: -52px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 246, 184, 0.86), rgba(250, 204, 21, 0.46) 38%, rgba(251, 146, 60, 0.18) 58%, transparent 74%);
      filter: blur(4px);
      animation: heatPulse 2.8s ease-in-out infinite;
    }

    .ray-ring {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      animation: raySpin 18s linear infinite;
    }

    .ray {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 36px;
      border-radius: 999px;
      background: rgba(255, 246, 184, 0.9);
      transform-origin: 2.5px 84px;
      box-shadow: 0 0 18px rgba(255, 246, 184, 0.82);
    }

    .ray:nth-child(1) { transform: translate(-50%, -84px) rotate(0deg); }
    .ray:nth-child(2) { transform: translate(-50%, -84px) rotate(45deg); }
    .ray:nth-child(3) { transform: translate(-50%, -84px) rotate(90deg); }
    .ray:nth-child(4) { transform: translate(-50%, -84px) rotate(135deg); }
    .ray:nth-child(5) { transform: translate(-50%, -84px) rotate(180deg); }
    .ray:nth-child(6) { transform: translate(-50%, -84px) rotate(225deg); }
    .ray:nth-child(7) { transform: translate(-50%, -84px) rotate(270deg); }
    .ray:nth-child(8) { transform: translate(-50%, -84px) rotate(315deg); }

    .sun-core {
      position: absolute;
      inset: 48px;
      border-radius: 999px;
      background: radial-gradient(circle at 34% 28%, #fffdf0, var(--sun-core) 30%, var(--sun) 66%, #f97316 100%);
      box-shadow:
        0 0 34px rgba(255, 229, 137, 0.98),
        0 0 98px rgba(251, 146, 60, 0.72);
      animation: corePulse 2.9s ease-in-out infinite;
    }

    .heat-wave {
      position: absolute;
      left: var(--left, 50%);
      bottom: var(--bottom, 90px);
      width: var(--width, 44px);
      height: var(--height, 220px);
      border-radius: 999px;
      background:
        linear-gradient(180deg, transparent, rgba(255,255,255,0.22), transparent),
        radial-gradient(ellipse, rgba(255, 247, 237, 0.3), transparent 68%);
      filter: blur(var(--blur, 10px));
      opacity: var(--opacity, 0.34);
      transform: translateX(-50%) skewX(-8deg);
      animation: heatRise var(--duration, 5s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      z-index: 2;
    }

    .horizon-glow {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: 118px;
      height: 74px;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(255, 237, 213, 0.46), transparent 70%);
      filter: blur(18px);
      opacity: 0.6;
      animation: horizonShimmer 5.2s ease-in-out infinite;
      z-index: 2;
    }

    .shimmer-layer {
      z-index: 8;
      backdrop-filter: blur(0.4px);
      -webkit-backdrop-filter: blur(0.4px);
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 18px,
          rgba(255,255,255,0.08) 18px 20px,
          transparent 20px 44px
        );
      opacity: 0.28;
      transform: skewX(-7deg) translateX(-12%);
      animation: shimmerSlide 3.8s ease-in-out infinite;
      mask: linear-gradient(180deg, transparent 0%, black 26%, black 86%, transparent 100%);
      -webkit-mask: linear-gradient(180deg, transparent 0%, black 26%, black 86%, transparent 100%);
    }

    .spark {
      position: absolute;
      left: var(--left, 50%);
      top: var(--top, 50%);
      width: var(--size, 7px);
      height: var(--size, 7px);
      opacity: 0;
      animation: sparkle 3s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      z-index: 9;
      filter: drop-shadow(0 0 10px rgba(255, 246, 184, 0.78));
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 100%;
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      transform: translate(-50%, -50%);
    }

    .spark::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .glass-panel {
      position: relative;
      z-index: 12;
      margin-top: 110px;
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.44), rgba(255,255,255,0.16));
      backdrop-filter: blur(28px) saturate(155%);
      -webkit-backdrop-filter: blur(28px) saturate(155%);
      box-shadow:
        0 24px 80px rgba(127, 29, 29, 0.22),
        inset 0 1px 0 rgba(255,255,255,0.64),
        inset 0 -1px 0 rgba(255,255,255,0.18);
    }

    .glass-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(110deg, transparent 0 30%, rgba(255,255,255,0.28) 43%, transparent 58% 100%);
      opacity: 0;
      transform: translateX(-70%);
      animation: glassSweep 6.8s ease-in-out infinite;
      pointer-events: none;
    }

    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 1px 14px rgba(127,29,29,0.2);
      font-weight: 650;
      font-size: 14px;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .temp-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 16px;
      margin-top: 14px;
    }

    .temperature {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 92px;
      line-height: 0.9;
      letter-spacing: -0.08em;
      color: rgba(255,255,255,0.98);
      text-shadow: 0 18px 56px rgba(127,29,29,0.22);
    }

    .feels {
      padding-top: 12px;
      text-align: right;
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      font-weight: 650;
    }

    .feels strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      line-height: 1.05;
      font-weight: 400;
    }

    .condition-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: rgba(255,255,255,0.96);
    }

    .mini-hot-icon {
      width: 42px;
      height: 38px;
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
    }

    .mini-hot-icon::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 2px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: radial-gradient(circle at 32% 28%, #fff9c4, #facc15 52%, #fb923c 100%);
      box-shadow: 0 0 18px rgba(255, 237, 137, 0.9);
      animation: miniSunPulse 2.2s ease-in-out infinite;
    }

    .mini-hot-icon span {
      position: absolute;
      left: 4px;
      bottom: 0;
      width: 34px;
      height: 10px;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(255,255,255,0.82) 5px 7px, transparent 7px 12px);
      filter: blur(0.6px);
      animation: miniShimmer 1.6s ease-in-out infinite;
    }

    .condition-text strong {
      display: block;
      font-size: 18px;
      line-height: 1.15;
    }

    .condition-text span {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: rgba(255,255,255,0.72);
      font-weight: 600;
    }

    .divider {
      height: 1px;
      margin: 20px 0 14px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52), transparent);
    }

    .verdict-label {
      color: rgba(37,18,10,0.5);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .verdict {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 1.08;
      color: rgba(37,18,10,0.84);
      text-wrap: balance;
    }

    .heat-mark {
      font-size: 25px;
      display: inline-block;
      animation: heatMark 2.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 14px rgba(127,29,29,0.12));
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.32);
    }

    .stat-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.34);
      color: rgba(37,18,10,0.62);
      flex: 0 0 auto;
    }

    .stat-title {
      font-size: 11px;
      color: rgba(37,18,10,0.48);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin-top: 1px;
      font-size: 13px;
      color: rgba(37,18,10,0.78);
      font-weight: 760;
    }

    .outfit-strip {
      position: relative;
      z-index: 12;
      margin-top: 18px;
    }

    .strip-title {
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      font-weight: 780;
      text-shadow: 0 1px 18px rgba(127,29,29,0.16);
    }

    .chips {
      display: flex;
      gap: 9px;
      margin-top: 10px;
      overflow: hidden;
    }

    .chip {
      flex: 1;
      min-height: 70px;
      border-radius: 20px;
      padding: 10px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(37,18,10,0.76);
      box-shadow: 0 12px 36px rgba(127,29,29,0.12), inset 0 1px 0 rgba(255,255,255,0.32);
    }

    .chip strong {
      display: block;
      font-size: 12px;
    }

    .chip span {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      color: rgba(37,18,10,0.52);
      font-weight: 700;
    }

    .bottom-note {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 18px rgba(127,29,29,0.16);
    }

    .motion-pill {
      white-space: nowrap;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.34);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    @keyframes heatLight {
      0%, 100% { opacity: 0.66; transform: translateX(-2%) scale(1); }
      50% { opacity: 1; transform: translateX(4%) scale(1.02); }
    }

    @keyframes sunFloat {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-6px, 8px, 0) scale(1.04); }
    }

    @keyframes heatPulse {
      0%, 100% { opacity: 0.72; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes raySpin {
      to { transform: rotate(360deg); }
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes heatRise {
      0% { transform: translateX(-50%) translateY(32px) skewX(-10deg) scaleY(0.86); opacity: 0; }
      22% { opacity: var(--opacity, 0.34); }
      68% { opacity: var(--opacity, 0.34); }
      100% { transform: translateX(-50%) translateY(-58px) skewX(8deg) scaleY(1.16); opacity: 0; }
    }

    @keyframes horizonShimmer {
      0%, 100% { opacity: 0.42; transform: scaleX(0.94); }
      50% { opacity: 0.74; transform: scaleX(1.06); }
    }

    @keyframes shimmerSlide {
      0%, 100% { transform: skewX(-7deg) translateX(-16%); opacity: 0.2; }
      50% { transform: skewX(-11deg) translateX(10%); opacity: 0.36; }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.35) rotate(0deg); }
      45% { opacity: 0.86; transform: scale(1.04) rotate(45deg); }
      70% { opacity: 0.2; transform: scale(0.76) rotate(90deg); }
    }

    @keyframes glassSweep {
      0%, 30% { transform: translateX(-75%); opacity: 0; }
      46% { opacity: 0.48; }
      62%, 100% { transform: translateX(75%); opacity: 0; }
    }

    @keyframes miniSunPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(255, 237, 137, 0.7); }
      50% { transform: scale(1.1); box-shadow: 0 0 24px rgba(255, 237, 137, 1); }
    }

    @keyframes miniShimmer {
      0%, 100% { transform: translateX(-3px); opacity: 0.48; }
      50% { transform: translateX(5px); opacity: 1; }
    }

    @keyframes heatMark {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-3px) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 420px) {
      .stage { padding: 12px; }
      .weather-card { min-height: 540px; border-radius: 32px; padding: 20px; }
      .glass-panel { margin-top: 102px; padding: 18px; }
      .temperature { font-size: 78px; }
      .verdict { font-size: 22px; }
      .sun-system { right: 14px; transform: scale(0.92); }
      .bottom-note { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="OutfitOracle hot weather card animation demo">
    <section class="weather-card">
      <header class="topbar">
        <button class="menu-button" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="brand">OutfitOracle</div>
        <button class="save-button" aria-label="Save forecast">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 4h12v17l-6-3.5L6 21V4Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          </svg>
        </button>
      </header>

      <div class="heat-scene" aria-hidden="true">
        <div class="sun-system">
          <div class="sun-glow"></div>
          <div class="ray-ring">
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
            <span class="ray"></span>
          </div>
          <div class="sun-core"></div>
        </div>
        <span class="horizon-glow"></span>
      </div>

      <div class="shimmer-layer" aria-hidden="true"></div>
      <div id="heatWaveLayer" aria-hidden="true"></div>
      <div class="spark-layer" id="sparkLayer" aria-hidden="true"></div>

      <article class="glass-panel">
        <div class="location-row">
          <span class="location">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 21s7-5.2 7-12a7 7 0 1 0-14 0c0 6.8 7 12 7 12Z" stroke="currentColor" stroke-width="1.9" />
              <circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.9" />
            </svg>
            Toronto, CA
          </span>
          <span id="timeLabel">9:41</span>
        </div>

        <div class="temp-row">
          <div class="temperature">91°</div>
          <div class="feels">Feels like<strong>99°</strong></div>
        </div>

        <div class="condition-row">
          <span class="mini-hot-icon" aria-hidden="true"><span></span></span>
          <div class="condition-text">
            <strong>Hot</strong>
            <span>Bright, sticky, and personally excessive.</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="verdict-label">Verdict</div>
        <div class="verdict">
          <span>The forecast says linen.</span>
          <span class="heat-mark" aria-hidden="true">☀︎</span>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-icon" aria-hidden="true">☀︎</div>
            <div>
              <div class="stat-title">UV Index</div>
              <div class="stat-value">Very High</div>
            </div>
          </div>
          <div class="stat">
            <div class="stat-icon" aria-hidden="true">⌁</div>
            <div>
              <div class="stat-title">Humidity</div>
              <div class="stat-value">68%</div>
            </div>
          </div>
        </div>
      </article>

      <section class="outfit-strip" aria-label="Outfit context">
        <div class="strip-title">Outfit logic</div>
        <div class="chips">
          <div class="chip"><strong>Linen</strong><span>Breathable</span></div>
          <div class="chip"><strong>Loose fit</strong><span>Airflow matters</span></div>
          <div class="chip"><strong>Hat</strong><span>UV strategy</span></div>
        </div>
      </section>

      <footer class="bottom-note">
        <span>Breathable fabrics or regret.</span>
        <span class="motion-pill">heat: shimmer · sun: pulse</span>
      </footer>
    </section>
  </main>

  <script>
    const timeLabel = document.getElementById("timeLabel");
    const heatWaveLayer = document.getElementById("heatWaveLayer");
    const sparkLayer = document.getElementById("sparkLayer");

    function updateTime() {
      const now = new Date();
      timeLabel.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function createHeatWaves(count = 14) {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const wave = document.createElement("span");
        wave.className = "heat-wave";

        const left = 4 + Math.random() * 92;
        const bottom = 34 + Math.random() * 210;
        const width = 24 + Math.random() * 48;
        const height = 120 + Math.random() * 220;
        const blur = 8 + Math.random() * 14;
        const opacity = 0.12 + Math.random() * 0.34;
        const duration = 3.6 + Math.random() * 4.6;
        const delay = Math.random() * -6;

        wave.style.setProperty("--left", `${left}%`);
        wave.style.setProperty("--bottom", `${bottom}px`);
        wave.style.setProperty("--width", `${width}px`);
        wave.style.setProperty("--height", `${height}px`);
        wave.style.setProperty("--blur", `${blur}px`);
        wave.style.setProperty("--opacity", opacity.toFixed(2));
        wave.style.setProperty("--duration", `${duration}s`);
        wave.style.setProperty("--delay", `${delay}s`);

        fragment.appendChild(wave);
      }

      heatWaveLayer.appendChild(fragment);
    }

    function createSparks(count = 18) {
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const spark = document.createElement("span");
        spark.className = "spark";

        spark.style.setProperty("--left", `${6 + Math.random() * 88}%`);
        spark.style.setProperty("--top", `${8 + Math.random() * 78}%`);
        spark.style.setProperty("--size", `${5 + Math.random() * 10}px`);
        spark.style.setProperty("--delay", `${Math.random() * -4}s`);

        fragment.appendChild(spark);
      }

      sparkLayer.appendChild(fragment);
    }

    updateTime();
    setInterval(updateTime, 30_000);
    createHeatWaves();
    createSparks();
  </script>
</body>
</html>
